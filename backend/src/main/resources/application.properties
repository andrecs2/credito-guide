app.name=Credito Guide
app.version=1.0.0

spring.application.name=credito-guide
spring.jackson.serialization.indent_output=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.defaults.enabled=true
management.health.kafka.timeout=1000


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
server.port=${BACKEND_PORT}

#server.servlet.context-path=/api

logging.level.org.springdoc=DEBUG

spring.jpa.hibernate.dialect = org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=2
spring.kafka.producer.properties.metadata.max.age.ms=10000
spring.kafka.producer.properties.max.block.ms=1500
spring.kafka.producer.properties.delivery.timeout.ms=2000
spring.kafka.producer.batch-size=16384
spring.kafka.producer.properties.request.timeout.ms=30000


spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.properties.bootstrap.servers=${spring.kafka.bootstrap-servers}

spring.kafka.consumer.group-id=credito-guide-group-${random.uuid}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.request.timeout.ms=3000
spring.kafka.consumer.properties.fetch.max.wait.ms=5000

spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties.request.timeout.ms=3000
spring.kafka.admin.properties.metadata.max.age.ms=5000

kafka.topic.consulta=${KAFKA_TOPIC_CONSULTA:consulta-realizada}

spring.config.activate.on-profile=kafka-tolerant

logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.web.servlet.resource=ERROR


