services:
  mariadb:
    image: mariadb:10.11
    container_name: ${DB_CONTAINER_NAME}
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MARIADB_ROOT_HOST: '%'
      MARIADB_HOST: '%'
    ports:
      - "${DB_PORT}:3306"
    networks:
      - credito-network
    volumes:
      - mariadb_data_credito:/var/lib/mysql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0 
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=localhost", "--user=root", "--password=$DB_ROOT_PASSWORD"]
      timeout: 5s
      retries: 10
      start_period: 30s
  adminer:
    image: adminer:latest
    container_name: ${ADMINER_CONTAINER_NAME}
    restart: always
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - credito-network
    depends_on:
      mariadb:
        condition: service_healthy
  backend:
    build: ./backend
    container_name: ${BACKEND_CONTAINER_NAME}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT:-8080}"
    networks:
      - credito-network
    environment:
      APP_ENVIRONMENT: ${ENVIRONMENT:-production}
      JAVA_OPTS: "-Xmx512m -Xms256m"
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_SERVICE_NAME}:9092
      BACKEND_HOST: ${BACKEND_HOST}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_SERVICE_NAME}:9092
      SPRING_KAFKA_PROPERTIES_BOOTSTRAP_SERVERS: ${KAFKA_SERVICE_NAME}:9092
      # SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/creditos_db_teste?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_started
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ${KAFKA_CONTAINER_NAME:-creditos-kafka}
    hostname: kafka
    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_KRAFT_MODE: "true"
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
 
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-1}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}
      KAFKA_CFG_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_CFG_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:-controller,broker}
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:9093}
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_SERVICE_NAME}:${KAFKA_PORT}
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-1}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_TOPIC_CONSULTA: ${KAFKA_TOPIC_CONSULTA:-consulta-realizada}
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.producer.async.DefaultEventHandler=WARN,state.change.logger=WARN,org.apache.kafka.image.loader.MetadataLoader=ERROR"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:--1}
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "9093:9093"
    volumes:
      - kafka_data_credito:/tmp/kraft-combined-logs
    networks:
      - credito-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "$$KAFKA_SERVICE_NAME:$$KAFKA_PORT", "--list"]
      timeout: 10s
      retries: 10
      start_period: 30s
  frontend:
    image: node:20-alpine
    working_dir: /app
    container_name: creditos-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./front-creditos:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=${BACKEND_PORT}
    networks:
      - credito-network
    command: >
      sh -c "
      echo 'Instalando dependências...' &&
      npm ci --legacy-peer-deps &&
      echo 'Iniciando Angular...' &&
      npm start
      "
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_PORT}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  kafka-consumer-logger:
    image: confluentinc/cp-kafka:7.4.0
    container_name: creditos-kafka-logger
    depends_on:
      - kafka
    networks:
      - credito-network
    command: 
      - /bin/sh
      - -c
      - |
        kafka-console-consumer --bootstrap-server ${KAFKA_SERVICE_NAME}:9092 --topic ${KAFKA_TOPIC_CONSULTA} --from-beginning
networks:
  credito-network:
    driver: bridge
volumes:
  mariadb_data_credito:
    driver: local
    name: ${DB_VOLUME_NAME}
  kafka_data_credito:
    driver: local
    name: ${KAFKA_VOLUME_NAME}